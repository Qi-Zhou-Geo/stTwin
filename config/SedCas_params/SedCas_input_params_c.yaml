# This is the SedCas model input parameters

# Note: the parameters are stored as a Python List or signle variable
# e.g.,
#  params1: 0.1 # this is a signle variable
#  params2:  # this is a list
#    - abc
#    - 0.2
#    - [abc, 0.2]

# for 10 minutes model

# Model input params
model_input:
  delta_t:
    name: time_resolution
    value: 0.16666666666666666 # 10 minutes -> 1/6 = 0.16666666666666666 hour, 1 hour -> 1
    attrs:
      unit: hour
      description: Input climate forcing time resolution
      calibrate: No

  in_prec:
    name: precipitation
    value: 1.0
    attrs:
      unit: mm / <time_resolution> (millimeters per <time_resolution>)
      description: Input climate forcing
      calibrate: No

  in_temp:
    name: temperature
    value: 0.0
    attrs:
      unit: °C
      description: Input climate forcing
      calibrate: No

  in_sun:
    name: Sun Radiation
    value: 0.0
    attrs:
      unit: °C
      description: W per m^2 (watts per square meter)
      calibrate: No

  num_iteration:
    name: num_iteration
    value: 100
    attrs:
      unit: None
      description: Number of stochastic simulations
      calibrate: No

# Model config params
model_config:
  # (1) Catchment params
  HRUs:
    name: hru
    value:
      - forest
      - bedrock
    attrs:
      unit: None
      description: Hydrological response units (HRU)
      calibrate: No

  num_HRU:
    name: num_hru
    value: 2
    attrs:
      unit: None
      description: Number of hydrological response units (HRU)
      calibrate: No

  # the origional name is: shares
  ratio_HRU: # Relative share of HRUs to total area
    name: ratio_hru
    value: # as List
      - 0.56 # for forest
      - 0.44 # for bedrok
    attrs:
      unit: ratio
      description: Relative ratio of HRUs to total area
      calibrate: Yes, by remote sensing or DEM data

  # the original name is: Ele
  c_elevation:
    name: c_elevation
    value: 1600.0
    attrs:
      unit: m (meter)
      description: Mean catchment elevation
      calibrate: Yes, by remote sensing or DEM data

  # area
  c_area:
    name: c_area
    value: 4.83
    attrs:
      unit: km^2
      description: Total catchment area
      calibrate: Yes, by remote sensing or DEM data

  # minDF
  min_df_v:
    name: min_df_v
    value: 2000.0
    attrs:
      unit: m^3
      description: Minium debris-flow volume
      calibrate: Yes, follow https://doi.org/10.1029/2020JF005739

  # rho_bulk
  rho_df:
    name: rho_df
    value: 2000.0
    attrs:
      unit: kg/m^3
      description: Density of debris flows
      calibrate: Yes, follow https://doi.org/10.1029/2020JF005739

  # rho_b
  rho_bedrock:
    name: rho_br
    value: 2600.0
    attrs:
      unit: kg/m^3
      description: Bedrock density
      calibrate: Yes, follow https://doi.org/10.1029/2020JF005739

  # rho_dry
  rho_sediment:
    name: rho_s
    value: 2000.0
    attrs:
      unit: kg/m^3
      description: Dry density of stored sediments
      calibrate: Yes, follow https://doi.org/10.1029/2020JF005739

  # shcap
  epsilon_h:
    name: hillslope_storage_cap
    value: 750000.0
    attrs:
      unit: m^3
      description: Hillslope sediment storage capacity
      calibrate: Yes, follow https://doi.org/10.1029/2020JF005739

  # (2) Hydrological params
  # Vwcaps
  epsilon_w:
    name: water_storage_cap
    value:
      - [72, 27] # for the forest
      - [4] # for the bedrock
    attrs:
      unit: mm
      description: Water storage capacities of HRUs
      calibrate: Yes, by what ?????

  # ks
  delta_t_water:
    name: water_residence_time
    value:
      - [94, 235] # for the forest
      - [23] # for the bedrock
    attrs:
      unit: h or minutes
      description: Mean residence time in saturated condition
      calibrate: Yes, by what ?????


  # (3) Climate forcing params
  # the original name is: Tsa
  snow_acc:
    name: snow_acc
    value: 0.6
    attrs:
      unit: °C
      description: Temperature threshold for snow accumulation
      calibrate: Yes, follow https://doi.org/10.1029/2020JF005739

  # the original name is: Tsm
  snow_melt:
    name: snow_melt
    value: 0.5
    attrs:
      unit: °C
      description: Temperature threshold for snow melt
      calibrate: Yes, follow https://doi.org/10.1029/2020JF005739

  # the original name is: mrate
  snow_melt_r:
    name: snow_melt_r
    value: 0.08
    attrs:
      unit: mm °C⁻¹ <time_resolution>⁻¹
      description: Snow melt rate (melt per °C above threshold (e.g., 0.08) per <time_resolution>)
      calibrate: Yes, follow https://doi.org/10.1029/2020JF005739

  # the original name is: Asnow
  snow_albedo_y:
    name: with_snow_albedo
    value:
      - 0.4 # for forest
      - 0.65 # for bedrock
    attrs:
      unit: None
      description: Albedo for HRUs when covered with snow
      calibrate: Yes, follow https://doi.org/10.1029/2020JF005739

  # the original name is: Anosnow
  snow_albedo_n:
    name: without_snow_albedo
    value:
      - 0.15 # for forest
      - 0.25 # for bedrock
    attrs:
      unit: None
      description: Albedo for HRUs when NOT covered with snow
      calibrate: Yes, follow https://doi.org/10.1029/2020JF005739

  # the original name is: alphaET
  et:
    name: evapotranspiration
    value: 20.0
    attrs:
      unit: None
      description: Evapotranspiration efficiency
      calibrate: Yes, follow https://doi.org/10.1029/2020JF005739

  # the original name is: cloud_cover_r
  cloud_cover_r:
    name: cloud_cover_r
    value: 1
    attrs:
      unit: None
      description: Cloud cover rate
      calibrate: Yes, follow https://doi.org/10.1029/2020JF005739

  # the original name is: cloud_cover_r
  r_humidity:
    name: relative_humidity
    value: 0.8
    attrs:
      unit: None
      description: Relative humidity (higher value -> saturated air)
      calibrate: Yes, follow https://doi.org/10.1029/2020JF005739


  # (4) Sediments generator params
  # LStrig:
  ls_trigger_m:
    name: ls_trigger_m
    value: thermal # can be ['thermal', 'rainfall', 'random']
    attrs:
      unit: None
      description: Landslide triggering mechanism
      calibrate: Yes, follow https://doi.org/10.1029/2020JF005739

  # Tsd
  ls_trigger_SWE:
    name: ls_trigger_SWE
    value: 20
    attrs:
      unit: mm
      description: SWE threshold for landslide triggered by SWE (snow water equivalent)
      calibrate: Yes, follow https://doi.org/10.1029/2020JF005739

  # Tfreeze
  ls_trigger_f:
    name: ls_trigger_freeze
    value: 0
    attrs:
      unit: °C
      description: Temperature threshold for landslide triggered by freezing
      calibrate: Yes, follow https://doi.org/10.1029/2020JF005739

  # Tpr
  ls_trigger_r:
    name: ls_trigger_rainfall
    value: 7.9
    attrs:
      unit: mm / <time_resolution>>
      description: Rainfall threshold for landslide triggered by precipitation
      calibrate: Yes, follow https://doi.org/10.1029/2020JF005739


  # ls_xmin
  ls_min_v:
    name: ls_min_v
    value: 233
    attrs:
      unit: m^3
      description: Minimum potential landslide volume
      calibrate: Yes, follow https://doi.org/10.1029/2020JF005739

  # ls_alpha:
  ls_alpha_v:
    name: ls_alpha_v
    value: 1.69
    attrs:
      unit: None
      description: Power-law exponent for generating landslide
      calibrate: Yes, follow https://doi.org/10.1029/2020JF005739

  # ls_cutoff
  ls_max_v:
    name: ls_max_v
    value: 3000000
    attrs:
      unit: m^3
      description: Maximum potential landslide volume
      calibrate: Yes, follow https://doi.org/10.1029/2020JF005739


  # (5) Sediments transport params
  # rhc
  h2s_r:
    name: h2s_deposition_rate
    value: 0.12
    attrs:
      unit: None
      description: Sediments deposition rate from hillslope to channel
      calibrate: Yes, follow https://doi.org/10.1029/2020JF005739

  # qdf
  q_df:
    name: discharge_df
    value: 0.40 # 10 minutes -> 0.4 = 2.4 / 6, 1 hour -> 2.4
    attrs:
      unit: mm / <time_resolution>
      description: Discharge threshold for triggering debris flows
      calibrate: Yes

  # smax
  max_s2w:
    name: max_s2w
    value: 0.57
    attrs:
      unit: None
      description: Max volumetric sediment to water ratio
      calibrate: Yes, follow https://doi.org/10.1029/2020JF005739

  # bedload related
  # smax_nodf
  max_s_c:
    name: max_s_concentration
    value: 0.4
    attrs:
      unit: None
      description: Max possible sediment concentration for bedload
      calibrate: Yes, follow https://doi.org/10.1029/2020JF005739

  # a
  scaling_a:
    name: scaling_a
    value: auto
    attrs:
      unit: None
      description: Scaling parameter for bedload transport
      calibrate: Yes, follow https://doi.org/10.1029/2020JF005739

  # b
  scaling_b:
    name: scaling_b
    value: 1.5
    attrs:
      unit: None
      description: Shape parameter for bedload transport
      calibrate: Yes, follow https://doi.org/10.1029/2020JF005739

  # Qmin_nondf
  min_q_bl:
    name: min_discharge_bl
    value: ????
    attrs:
      unit: None
      description: Minimum discharge for bedload transport initiation
      calibrate: Yes, follow https://doi.org/10.1029/2020JF005739


# Model output params
model_output:
  out_hydro_container:
    name: hydrological_output
    value: 1.0
    attrs:
      unit: Check <_create_hydro_dataset>
      description: xr dataset contains time seris data
      calibrate: No

  out_sed_container:
    name: sediments_output
    value: 1.0
    attrs:
      unit: Check <_create_sed_dataset>
      description: xr dataset contains time seris data
      calibrate: No
