name: stTwin

channels:
  - conda-forge

dependencies:
  # Python
  - python=3.11.13

  # Core scientific stack
  - numpy=1.26.4
  - scipy=1.16.2
  - pandas=2.2.3
  - xarray=2025.12.0

  # Optimization / calibration
  - optuna=4.7.0
  - emcee=3.1.6

  # Seismic
  - obspy=1.4.2

  # Visualization
  - plotly=6.5.2
  - dash=3.2.0
  - matplotlib=3.10.8
  - seaborn=0.13.2
  - corner=2.2.3

  # Jupyter / dev
  - ipython=9.8.0
  - ipykernel=7.1.0
  - jupyter_client=8.6.3

  # Utilities
  - pyyaml=6.0.3
  - tqdm=4.67.1
  - requests=2.32.5
  - filelock=3.20.3
  - zarr=3.1.5
  - dask=2026.3.0
  - h5py=3.15.1
  - schedule=1.2.2

  # Machine learning
  - joblib=1.5.3
  - scikit-learn=1.8.0

  # Pip-only packages
  - pip=25.2
  - pip:
      - ruamel-yaml==0.19.1