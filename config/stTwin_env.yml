name: stTwin

channels:
  - conda-forge
  - defaults

dependencies:
  # Python
  - python=3.11.13

  # Core scientific stack
  - numpy=1.26.4
  - scipy=1.16.2
  - pandas=2.2.3
  - xarray=2025.12.0
  - statsmodels=0.14.5

  # Optimization / calibration
  - optuna=4.7.0

  # Seismic
  - obspy=1.4.2

  # Visualization
  - plotly=6.5.2
  - dash=3.2.0
  - matplotlib=3.10.8
  - seaborn=0.13.2

  # Jupyter / dev
  - ipython=9.8.0
  - ipykernel=7.1.0
  - jupyter_client=8.6.3

  # Utilities
  - pyyaml=6.0.3
  - tqdm=4.67.1
  - requests=2.32.5

  # Testing
  - pytest=9.0.1

  # Pip-only packages
  - pip=25.2
  - pip:
      - kaleido==1.2.0
      - choreographer==1.2.1
      - logistro==2.0.1
      - orjson==3.11.4
      - simplejson==3.20.2
      - pluggy==1.6.0
      - pytest-timeout==2.4.0
