# nginx
  nginx:

    image: nginx:stable-alpine
    restart: always

    ports:
      - "80:80" # for http
      # - "443:443" # for https

    volumes:
      # Mount the nginx config from this deploy folder into the nginx container
      # "./nginx/default.conf" is on the VM host
      # "/etc/nginx/conf.d/default.conf" is inside the container
      # ":ro" means read-only, so nginx can read the config but cannot change the host file
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    
    depends_on:
      - dashboard
