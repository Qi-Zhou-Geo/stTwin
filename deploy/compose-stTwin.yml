# service 1
services:
  sedcas:

    # Build Docker image
    # build:
    #   context: ${PROJECT_ROOT}
    #   dockerfile: ${PROJECT_ROOT}/deploy/Dockerfile
    
    # Or use the loaded imgae
    image: st-image:v0dot6

    # run as root, it may overwrite host files
    user: "0:0"

    # Inside the container, use "${WORKING_ROOT}" as the working folder
    working_dir: ${WORKING_ROOT}

    # start the work flow in container
    command: ${WORKING_ROOT}/func/liveshow/t1_main.py

    # Restart the container automatically if it crashes
    restart: always

    # Share folders between the real server and the docker container
    volumes:
      ## Mount this folder between the "Docker container" and the "server"
      ## two-way mount: "Docker container" <<-->> "server"
      - ${CACHE_DIR_HOST}:${CACHE_DIR_CONTAINER}

    # Environment variables passed into the container.
    environment:
      - PYTHONUNBUFFERED=1

# service 2
  dashboard:

    image: st-image:v0dot6
    user: "0:0"

    working_dir: ${WORKING_ROOT}
    command: ${WORKING_ROOT}/func/liveshow/t2_main.py --host 0.0.0.0 --port 8050

    restart: always
    volumes:
      - ${CACHE_DIR_HOST}:${CACHE_DIR_CONTAINER}
      - ${FLOW_ALERT_ROOT}/deploy/liveshow_cache:/Flow-Alert/deploy/liveshow_cache:ro

    environment:
      - PYTHONUNBUFFERED=1

